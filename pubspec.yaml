name: chibbyball_league
description: CHIBBYBALL League
publish_to: "none"

version: 1.0.2+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.15.4
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  google_mlkit_text_recognition: ^0.15.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Temporary compatibility pin: avoid shared_preferences_android 2.5.0,
# whose recent Pigeon-JNI implementation may be related to the runtime
# SharedPreferencesApiRegistrar.getAll NoSuchMethodError.
dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
