name: Build CHIBBYBALL APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Add Firebase configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          if not settings.exists():
              settings = Path("android/settings.gradle")

          app = Path("android/app/build.gradle.kts")
          if not app.exists():
              app = Path("android/app/build.gradle")

          if not settings.exists() or not app.exists():
              raise SystemExit("Android Gradle files not found")

          s = settings.read_text()
          a = app.read_text()

          if settings.suffix == ".kts":
              if 'id("com.google.gms.google-services")' not in s:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                      1,
                  )
              if 'id("com.google.gms.google-services")' not in a:
                  a = a.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services")',
                      1,
                  )
          else:
              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services' version '4.4.4' apply false",
                      1,
                  )
              if "com.google.gms.google-services" not in a:
                  a = a.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1,
                  )

          settings.write_text(s)
          app.write_text(a)
          print("Google Services plugin configured.")
          PY

      - name: Verify Firebase configuration
        run: |
          test -f android/app/google-services.json
          grep -q '"project_id": "chibbyball-league"' google-services.json
          grep -q '"package_name": "com.example.chibbyball_league"' google-services.json
          echo "Firebase configuration verified."

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Check Firebase generated resources
        run: |
          test -f android/app/build/generated/res/google-services/release/values/values.xml
          grep -q "google_app_id" android/app/build/generated/res/google-services/release/values/values.xml
          echo "FirebaseOptions resources generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHIBBYBALL-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy Push Notification Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: cupiklbeuxdjwjdkojfw
        run: |
          supabase functions deploy send-push-notification             --project-ref "$SUPABASE_PROJECT_ID"             --use-api
