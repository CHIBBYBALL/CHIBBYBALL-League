name: Build CHIBBYBALL APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Add Firebase configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Add Internet permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

      - name: Add ML Kit language dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          deps = [
              "com.google.mlkit:text-recognition-chinese:16.0.1",
              "com.google.mlkit:text-recognition-devanagari:16.0.1",
              "com.google.mlkit:text-recognition-japanese:16.0.1",
              "com.google.mlkit:text-recognition-korean:16.0.1",
          ]

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              path = groovy
              text = path.read_text()

              lines = "\n".join(
                  f'    implementation "{d}"'
                  for d in deps
                  if d not in text
              )

              if lines:
                  text += "\n\ndependencies {\n" + lines + "\n}\n"
                  path.write_text(text)

              print("Updated build.gradle")

          elif kotlin.exists():
              path = kotlin
              text = path.read_text()

              lines = "\n".join(
                  f'    implementation("{d}")'
                  for d in deps
                  if d not in text
              )

              if lines:
                  text += "\n\ndependencies {\n" + lines + "\n}\n"
                  path.write_text(text)

              print("Updated build.gradle.kts")

          else:
              raise SystemExit("Android Gradle file not found")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHIBBYBALL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
