name: Build CHIBBY League Creator

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Restore upload keystore
        run: |
          mkdir -p android

          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

          test -s android/upload-keystore.jks

          echo "Upload keystore restored successfully."

      - name: Create Android signing properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

          test -s android/key.properties

          echo "Android signing properties created."

      - name: Add Play package verification file
        env:
          PLAY_ADI_REGISTRATION: ${{ secrets.PLAY_ADI_REGISTRATION }}
        run: |
          mkdir -p assets

          printf '%s\n' "$PLAY_ADI_REGISTRATION" > assets/adi-registration.properties

          test -s assets/adi-registration.properties

          echo "Play verification file created."

      - name: Add verification file to Flutter assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path("pubspec.yaml")

          if not pubspec.exists():
              raise SystemExit("pubspec.yaml not found")

          text = pubspec.read_text()

          asset_line = "    - assets/adi-registration.properties"

          if "assets/adi-registration.properties" in text:
              print("Play verification asset already listed.")
              raise SystemExit(0)

          lines = text.splitlines()

          flutter_index = None

          for i, line in enumerate(lines):
              if line.strip() == "flutter:" and not line.startswith(" "):
                  flutter_index = i
                  break

          if flutter_index is None:
              raise SystemExit("flutter: section not found in pubspec.yaml")

          assets_index = None

          for i in range(flutter_index + 1, len(lines)):
              stripped = lines[i].strip()

              if stripped and not lines[i].startswith(" "):
                  break

              if stripped == "assets:":
                  assets_index = i
                  break

          if assets_index is not None:
              insert_at = assets_index + 1

              while (
                  insert_at < len(lines)
                  and (
                      lines[insert_at].startswith(" ")
                      or lines[insert_at].strip() == ""
                  )
              ):
                  insert_at += 1

              lines.insert(insert_at, asset_line)

          else:
              insert_at = flutter_index + 1

              while (
                  insert_at < len(lines)
                  and (
                      lines[insert_at].startswith(" ")
                      or lines[insert_at].strip() == ""
                  )
              ):
                  insert_at += 1

              lines.insert(insert_at, "  assets:")
              lines.insert(insert_at + 1, asset_line)

          pubspec.write_text("\n".join(lines) + "\n")

          print("Play verification asset added to pubspec.yaml.")
          PY

      - name: Configure Android release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              text = path.read_text()

              if "keystoreProperties" not in text:
                  import_block = """import java.util.Properties
          import java.io.FileInputStream

          """

                  text = import_block + text

                  marker = "android {"

                  signing_properties = """val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """

                  text = text.replace(
                      marker,
                      signing_properties + marker,
                      1
                  )

              if 'create("release")' not in text:
                  signing_config = """        signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties.getProperty("keyAlias")
                  keyPassword = keystoreProperties.getProperty("keyPassword")
                  storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }
                  storePassword = keystoreProperties.getProperty("storePassword")
              }
          }

          """

                  text = text.replace(
                      "    buildTypes {",
                      signing_config + "    buildTypes {",
                      1
                  )

              release_pattern = r'buildTypes\s*\{\s*release\s*\{(.*?)\n\s*\}'

              match = re.search(
                  release_pattern,
                  text,
                  re.DOTALL
              )

              if match:
                  release_block = match.group(1)

                  release_block = re.sub(
                      r'\s*signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                      "",
                      release_block
                  )

                  if 'signingConfigs.getByName("release")' not in release_block:
                      release_block += '\n        signingConfig = signingConfigs.getByName("release")'

                  replacement = (
                      "buildTypes {\n"
                      "        release {"
                      + release_block
                      + "\n    }"
                  )

                  text = text[:match.start()] + replacement + text[match.end():]

              path.write_text(text)

              print(f"Release signing configured in {path}.")

          elif groovy.exists():
              path = groovy
              text = path.read_text()

              if "keystoreProperties" not in text:
                  import_block = """import java.util.Properties
          import java.io.FileInputStream

          """

                  text = import_block + text

                  marker = "android {"

                  signing_properties = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """

                  text = text.replace(
                      marker,
                      signing_properties + marker,
                      1
                  )

              if "signingConfigs {" not in text:
                  signing_config = """    signingConfigs {
              release {
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
                  storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                  storePassword keystoreProperties['storePassword']
              }
          }

          """

                  text = text.replace(
                      "    buildTypes {",
                      signing_config + "    buildTypes {",
                      1
                  )

              release_pattern = r'buildTypes\s*\{\s*release\s*\{(.*?)\n\s*\}'

              match = re.search(
                  release_pattern,
                  text,
                  re.DOTALL
              )

              if match:
                  release_block = match.group(1)

                  release_block = re.sub(
                      r'\s*signingConfig\s*=?\s*signingConfigs\.debug',
                      "",
                      release_block
                  )

                  if "signingConfigs.release" not in release_block:
                      release_block += "\n        signingConfig signingConfigs.release"

                  replacement = (
                      "buildTypes {\n"
                      "        release {"
                      + release_block
                      + "\n    }"
                  )

                  text = text[:match.start()] + replacement + text[match.end():]

              path.write_text(text)

              print(f"Release signing configured in {path}.")

          else:
              raise SystemExit("No Android app Gradle file found.")
          PY

      - name: Set CHIBBY League Creator app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = manifest.read_text()

          new_label = 'android:label="CHIBBY League Creator"'

          if 'android:label="' in text:
              text = re.sub(
                  r'android:label="[^"]*"',
                  new_label,
                  text,
                  count=1
              )
          else:
              raise SystemExit("Application label not found")

          manifest.write_text(text)

          print("App name set to: CHIBBY League Creator")
          PY

      - name: Apply CHIBBYBALL launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          ICON="chibbyball_creator_icon.png"
          test -f "$ICON"

          declare -A SIZES=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )

          for density in "${!SIZES[@]}"; do
            size="${SIZES[$density]}"

            mkdir -p "android/app/src/main/res/mipmap-$density"

            convert "$ICON" \
              -resize "${size}x${size}" \
              -gravity center \
              -background none \
              -extent "${size}x${size}" \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png"

            cp \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png" \
              "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "CHIBBYBALL launcher icon applied successfully."

      - name: Add Firebase configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          if not settings.exists():
              settings = Path("android/settings.gradle")

          app = Path("android/app/build.gradle.kts")
          if not app.exists():
              app = Path("android/app/build.gradle")

          if not settings.exists() or not app.exists():
              raise SystemExit("Android Gradle files not found")

          s = settings.read_text()
          a = app.read_text()

          if settings.suffix == ".kts":
              if 'id("com.google.gms.google-services")' not in s:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                      1,
                  )

              if 'id("com.google.gms.google-services")' not in a:
                  a = a.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services")',
                      1,
                  )

          else:
              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services' version '4.4.4' apply false",
                      1,
                  )

              if "com.google.gms.google-services" not in a:
                  a = a.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1,
                  )

          settings.write_text(s)
          app.write_text(a)

          print("Google Services plugin configured.")
          PY

      - name: Verify Firebase configuration
        run: |
          test -f android/app/google-services.json
          grep -q '"project_id": "chibbyball-league"' google-services.json
          grep -q '"package_name": "com.example.chibbyball_league"' google-services.json
          echo "Firebase configuration verified."

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          fi

      - name: Add ML Kit language dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          target = next((f for f in files if f.exists()), None)

          if target is None:
              raise SystemExit("Android Gradle file not found")

          text = target.read_text()

          if target.suffix == ".kts":
              deps = [
                  'implementation("com.google.mlkit:text-recognition-chinese:16.0.1")',
                  'implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")',
                  'implementation("com.google.mlkit:text-recognition-japanese:16.0.1")',
                  'implementation("com.google.mlkit:text-recognition-korean:16.0.1")',
              ]
          else:
              deps = [
                  'implementation "com.google.mlkit:text-recognition-chinese:16.0.1"',
                  'implementation "com.google.mlkit:text-recognition-devanagari:16.0.1"',
                  'implementation "com.google.mlkit:text-recognition-japanese:16.0.1"',
                  'implementation "com.google.mlkit:text-recognition-korean:16.0.1"',
              ]

          missing = [dep for dep in deps if dep not in text]

          if missing:
              marker = "dependencies {"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n    " + "\n    ".join(missing),
                      1,
                  )
              else:
                  text = (
                      text.rstrip()
                      + "\n\ndependencies {\n    "
                      + "\n    ".join(missing)
                      + "\n}\n"
                  )

              target.write_text(text)

          print(f"ML Kit language dependencies configured in {target}.")
          PY

      - name: Verify signing setup
        run: |
          test -f android/upload-keystore.jks
          test -f android/key.properties
          test -f assets/adi-registration.properties

          echo "Signing and Play verification files are ready."

      - name: Get dependencies
        run: flutter pub get

      - name: Clean Flutter build
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Build verification APK
        run: flutter build apk --release

      - name: Rename verification APK
        run: |
          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            "CHIBBY-League-Creator-verification.apk"

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Rename AAB
        run: |
          cp \
            build/app/outputs/bundle/release/app-release.aab \
            "CHIBBY-League-Creator.aab"

      - name: Upload verification APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHIBBY-League-Creator-Verification-APK
          path: CHIBBY-League-Creator-verification.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHIBBY-League-Creator-AAB
          path: CHIBBY-League-Creator.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: chibbyball-aab-latest
          name: CHIBBY League Creator
          body: |
            # CHIBBY League Creator

            Signed Android App Bundle for Google Play.

            Signed verification APK for Android Developer package ownership verification.

            App name:
            CHIBBY League Creator
          files: |
            CHIBBY-League-Creator.aab
            CHIBBY-League-Creator-verification.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
