name: Build CHIBBYBALL APK + Prepare iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android and iOS projects
        run: flutter create --platforms=android,ios .

      - name: Add Firebase Android configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          if not settings.exists():
              settings = Path("android/settings.gradle")

          app = Path("android/app/build.gradle.kts")
          if not app.exists():
              app = Path("android/app/build.gradle")

          if not settings.exists() or not app.exists():
              raise SystemExit("Android Gradle files not found")

          s = settings.read_text()
          a = app.read_text()

          if settings.suffix == ".kts":
              if 'id("com.google.gms.google-services")' not in s:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                      1,
                  )

              if 'id("com.google.gms.google-services")' not in a:
                  a = a.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services")',
                      1,
                  )
          else:
              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services' version '4.4.4' apply false",
                      1,
                  )

              if "com.google.gms.google-services" not in a:
                  a = a.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1,
                  )

          settings.write_text(s)
          app.write_text(a)

          print("Google Services plugin configured.")
          PY

      - name: Verify Firebase Android configuration
        run: |
          test -f android/app/google-services.json
          grep -q '"project_id": "chibbyball-league"' google-services.json
          grep -q '"package_name": "com.example.chibbyball_league"' google-services.json
          echo "Firebase Android configuration verified."

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          fi

      - name: Add ML Kit language dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          target = next((f for f in files if f.exists()), None)

          if target is None:
              raise SystemExit("Android Gradle file not found")

          text = target.read_text()

          deps = [
              'implementation("com.google.mlkit:text-recognition-chinese:16.0.1")',
              'implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")',
              'implementation("com.google.mlkit:text-recognition-japanese:16.0.1")',
              'implementation("com.google.mlkit:text-recognition-korean:16.0.1")',
          ]

          missing = [dep for dep in deps if dep not in text]

          if missing:
              marker = "dependencies {"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n    " + "\n    ".join(missing),
                      1,
                  )
              else:
                  text = (
                      text.rstrip()
                      + "\n\ndependencies {\n    "
                      + "\n    ".join(missing)
                      + "\n}\n"
                  )

              target.write_text(text)

          print("ML Kit language dependencies configured.")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Verify iOS project was generated
        run: |
          test -d ios
          test -f ios/Runner.xcodeproj/project.pbxproj
          echo "iOS project generated successfully."

      - name: Upload prepared iOS project
        uses: actions/upload-artifact@v4
        with:
          name: CHIBBYBALL-iOS-Project
          path: ios/

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHIBBYBALL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
