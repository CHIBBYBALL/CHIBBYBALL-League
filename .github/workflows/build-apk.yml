name: Build CHIBBY League Creator AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Set CHIBBY League Creator app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = manifest.read_text()

          new_label = 'android:label="CHIBBY League Creator"'

          if 'android:label="' in text:
              text = re.sub(
                  r'android:label="[^"]*"',
                  new_label,
                  text,
                  count=1
              )
          else:
              raise SystemExit("Application label not found")

          manifest.write_text(text)

          print("App name set to: CHIBBY League Creator")
          PY

      - name: Apply CHIBBYBALL launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          ICON="chibbyball_creator_icon.png"
          test -f "$ICON"

          declare -A SIZES=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )

          for density in "${!SIZES[@]}"; do
            size="${SIZES[$density]}"

            mkdir -p "android/app/src/main/res/mipmap-$density"

            convert "$ICON" \
              -resize "${size}x${size}" \
              -gravity center \
              -background none \
              -extent "${size}x${size}" \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png"

            cp \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png" \
              "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "CHIBBYBALL launcher icon applied successfully."

      - name: Add Firebase configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          if not settings.exists():
              settings = Path("android/settings.gradle")

          app = Path("android/app/build.gradle.kts")
          if not app.exists():
              app = Path("android/app/build.gradle")

          if not settings.exists() or not app.exists():
              raise SystemExit("Android Gradle files not found")

          s = settings.read_text()
          a = app.read_text()

          if settings.suffix == ".kts":
              if 'id("com.google.gms.google-services")' not in s:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                      1,
                  )

              if 'id("com.google.gms.google-services")' not in a:
                  a = a.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services")',
                      1,
                  )
          else:
              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services' version '4.4.4' apply false",
                      1,
                  )

              if "com.google.gms.google-services" not in a:
                  a = a.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1,
                  )

          settings.write_text(s)
          app.write_text(a)

          print("Google Services plugin configured.")
          PY

      - name: Verify Firebase configuration
        run: |
          test -f android/app/google-services.json
          grep -q '"project_id": "chibbyball-league"' google-services.json
          grep -q '"package_name": "com.example.chibbyball_league"' google-services.json
          echo "Firebase configuration verified."

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          fi

      - name: Add ML Kit language dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          target = next((f for f in files if f.exists()), None)

          if target is None:
              raise SystemExit("Android Gradle file not found")

          text = target.read_text()

          if target.suffix == ".kts":
              deps = [
                  'implementation("com.google.mlkit:text-recognition-chinese:16.0.1")',
                  'implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")',
                  'implementation("com.google.mlkit:text-recognition-japanese:16.0.1")',
                  'implementation("com.google.mlkit:text-recognition-korean:16.0.1")',
              ]
          else:
              deps = [
                  'implementation "com.google.mlkit:text-recognition-chinese:16.0.1"',
                  'implementation "com.google.mlkit:text-recognition-devanagari:16.0.1"',
                  'implementation "com.google.mlkit:text-recognition-japanese:16.0.1"',
                  'implementation "com.google.mlkit:text-recognition-korean:16.0.1"',
              ]

          missing = [dep for dep in deps if dep not in text]

          if missing:
              marker = "dependencies {"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n    " + "\n    ".join(missing),
                      1,
                  )
              else:
                  text = (
                      text.rstrip()
                      + "\n\ndependencies {\n    "
                      + "\n    ".join(missing)
                      + "\n}\n"
                  )

              target.write_text(text)

          print(f"ML Kit language dependencies configured in {target}.")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Rename AAB
        run: |
          cp \
            build/app/outputs/bundle/release/app-release.aab \
            "CHIBBY-League-Creator.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHIBBY-League-Creator-AAB
          path: CHIBBY-League-Creator.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: chibbyball-aab-latest
          name: CHIBBY League Creator AAB
          body: |
            # CHIBBY League Creator

            Android App Bundle for Google Play.

            App name:
            CHIBBY League Creator
          files: CHIBBY-League-Creator.aab
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
